name: Deploy Supabase Edge Functions

# Fallback deploy path (M7): this sandbox's local tooling could not
# reliably deploy Edge Functions — the Windows Supabase CLI's bundler
# fails on every function (even a trivial zero-import one) with an
# opaque "Effect.tryPromise" error, and the WSL CLI's bundler works but
# hits intermittent network failures reaching api.supabase.com from
# this specific sandbox. GitHub's own Linux runners have neither
# problem, so this is the reliable path going forward, not just a
# stopgap.
on:
  push:
    branches: [master]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref tacnqewyrdaxexqcbxhz
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
